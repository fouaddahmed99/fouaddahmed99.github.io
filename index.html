<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUSP LRN — Pediatric Dentistry Boards</title>
    <meta name="description" content="Free, source-grounded board prep for pediatric dentistry residents." />
    <!-- Forward to the app. If JS is off, this still redirects after 1s. -->
    <meta http-equiv="refresh" content="1; url=https://fouaddahmed99.github.io/cusp-lrn-web/" />
    <link rel="canonical" href="https://fouaddahmed99.github.io/cusp-lrn-web/" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        min-height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f7f8fa;
        color: #17202a;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1419; color: #e6ebf0; }
        .muted { color: #9aa6b2 !important; }
        .btn { background: #7cc0ec !important; color: #0b1620 !important; }
      }
      .card { text-align: center; max-width: 440px; }
      .mark {
        width: 72px; height: 72px; border-radius: 16px; background: #1f5f8b;
        display: grid; place-items: center; margin: 0 auto 20px;
      }
      .mark svg { width: 44px; height: 44px; }
      h1 { font-size: 1.9rem; font-weight: 700; margin: 0 0 6px; letter-spacing: .5px; }
      h1 .lrn { color: #2f8f6b; }
      p { margin: 0 0 20px; line-height: 1.55; }
      .muted { color: #5b6573; font-size: .95rem; }
      .btn {
        display: inline-block; background: #1f5f8b; color: #fff; text-decoration: none;
        font-weight: 600; padding: 12px 22px; border-radius: 10px; min-height: 44px;
      }
      .spinner {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid rgba(127,127,127,.35); border-top-color: currentColor;
        display: inline-block; vertical-align: -3px; margin-right: 8px;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 32c4-12 20-12 24 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
          <circle cx="24" cy="17" r="4" fill="#fff" />
        </svg>
      </div>
      <h1>CUSP <span class="lrn">LRN</span></h1>
      <p class="muted"><span class="spinner" aria-hidden="true"></span>Opening the study platform&hellip;</p>
      <p><a class="btn" href="https://fouaddahmed99.github.io/cusp-lrn-web/">Enter CUSP LRN</a></p>
      <p class="muted">Free during launch · no account needed</p>
    </main>
    <script>
      // Fastest path when JS is on; the meta-refresh above is the fallback.
      location.replace("https://fouaddahmed99.github.io/cusp-lrn-web/");
    </script>
  </body>
</html>
